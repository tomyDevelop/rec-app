<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズ一覧</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/quizzes.css">
  </head>
  <body>
    <header class="header">
      <p class="header__text">クイズ一覧</p>
    </header>
    <div class="container">
      <section class="section">
				<div class="input-item">
					<label for="categories" class="input-item__label">カテゴリ</label>
					<div class="input-item__body">
						<div class="input-item__field">
							<div class="select-wrap">
								<select name="categories" id="categories" required>
									<option value="0">すべて</option>
									<option value="1">季節</option>
								</select>
							</div>
						</div>
					</div>
				</div>
      </section>
      <section class="section">
        <ul class="quiz-list">
          <li class="quiz-list__item">
            <span class="quiz-list__ttl">梅雨クイズ</span>
            <a class="quiz-list__solve-button" href="rainy-season/">解く</a>
          </li>
          <li class="quiz-list__item">
            <span class="quiz-list__ttl">夏クイズ</span>
            <a class="quiz-list__solve-button" href="summer/">解く</a>
          </li>
        </ul>
      </section>
    </div>
  </body>
</html>
